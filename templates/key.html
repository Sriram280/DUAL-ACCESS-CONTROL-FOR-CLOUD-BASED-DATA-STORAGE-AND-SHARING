<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Creative - Start Bootstrap Theme</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="static/assets/img/favicon.ico" />
    <link href="static/css/styles.css" rel="stylesheet" />
</head>

<body id="page-top">
    <nav class="navbar navbar-expand-lg navbar-light fixed-top py-3" id="mainNav">
        <div class="container">
            <br>
            <ul class="navbar-nav ml-auto my-2 my-lg-0">
                <li class="nav-item"><a class="nav-link js-scroll-trigger" href="home">Home</a></li>
                <li class="nav-item"><a class="nav-link js-scroll-trigger" href="DataUsersProfile">Profile</a></li>
                <li class="nav-item"><a class="nav-link js-scroll-trigger" href="DataUsersSearchFiles">Search files</a>
                </li>
                <!--                        <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#DataOwners">Request Secret Key</a></li>-->
                <li class="nav-item"><a class="nav-link js-scroll-trigger" href="secretkeyresponse">View Secret Key
                        Response</a></li>
                <li class="nav-item"><a class="nav-link js-scroll-trigger" href="DataUsersLogin">Logout</a></li>

            </ul>
        </div>
    </nav>
    <!-- Masthead-->
    <header class="masthead">
        <div class="row h-100 align-items-center justify-content-center text-center">
            <h1 style="color:white">Dual access control for cloud based storage and sharing</h1>
            <div class="col-lg-10 align-self-end" align="center">


                {% if msg=="notfound" %}
                <h3>Entered key is not valid</h3>
                {% endif %}
                <th>File Download</th>

                <textarea id="source">{{data}}</textarea>
                <br>
                <a id="download" download="text.txt" href="data:application/txt;charset=utf-8,"
                    title="Save as text file">Download</a>

                <script type="text/javascript">
                    // When the document is ready
                    document.getElementById("download").onclick = function () {
                        var content = document.getElementById('source').value;
                        this.href = 'data:application/txt;charset=utf-8,' + encodeURIComponent(content);
                    };
                </script>

            </div>
            <div class="col-lg-8 align-self-baseline">
            </div>
        </div>
    </header>
    <script src="static/js/scripts.js"></script>
</body>

</html>
